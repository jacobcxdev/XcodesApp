name: Build and publish appcasts

'on':
  workflow_call:
    inputs:
      tag:
        description: Published release tag matching vX.Y.ZbN
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag matching vX.Y.ZbN
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: appcast-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jacobcxdev/XcodesApp' && github.ref == format('refs/tags/{0}', inputs.tag || github.event.release.tag_name)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUNDLER_VERSION: '4.0.16'
      BUNDLE_FROZEN: 'true'
      BUNDLE_PATH: vendor/bundle
      EXPECTED_RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout expected release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable appcast source
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b(0|[1-9][0-9]*)$ ]] || { echo "Expected release tag must match vX.Y.ZbN exactly" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$EXPECTED_RELEASE_TAG" ]] || { echo "Workflow must run from refs/tags/$EXPECTED_RELEASE_TAG" >&2; exit 1; }
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$EXPECTED_RELEASE_TAG:refs/tags/$EXPECTED_RELEASE_TAG"
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          readonly source_sha
          [[ "$source_sha" == "$(git rev-parse "$EXPECTED_RELEASE_TAG^{commit}")" ]] || { echo "Appcast tag does not point at checked-out commit" >&2; exit 1; }
          git merge-base --is-ancestor "$source_sha" origin/main || { echo "Appcast source is not on origin/main" >&2; exit 1; }

      - name: Verify fork appcast identity
        run: bash Scripts/check_appcast_identity.sh

      - name: Validate expected published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+b(0|[1-9][0-9]*)$ ]] || { echo "Expected release tag must match vX.Y.ZbN exactly" >&2; exit 1; }
          readonly release_root="$RUNNER_TEMP/appcast-release"
          rm -rf -- "$release_root"
          install -d -m 700 "$release_root/$EXPECTED_RELEASE_TAG"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_RELEASE_TAG")"
          readonly release_json
          jq -e --arg tag "$EXPECTED_RELEASE_TAG" '
            (.tag_name == $tag) and
            (.draft == false) and
            (.prerelease == false) and
            ((.assets | type) == "array") and
            (([.assets[].name] | sort) == ([
              "Xcodes.zip",
              "Xcodes.zip.sha256",
              "release-manifest.txt",
              "sparkle-signature.txt"
            ] | sort)) and
            (all(.assets[]; ((.size | type) == "number") and (.size > 0))) and
            ([
              .assets[]
              | select(
                  ((.name | type) == "string") and
                  (.name | ascii_downcase | endswith(".zip"))
                )
              | .name
            ] == ["Xcodes.zip"])
          ' <<< "$release_json" >/dev/null
          jq -er '.body | strings' <<< "$release_json" > "$release_root/release-body.txt"

      - name: Download and verify release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readonly release_root="$RUNNER_TEMP/appcast-release"
          readonly release_dir="$release_root/$EXPECTED_RELEASE_TAG"
          for asset in Xcodes.zip Xcodes.zip.sha256 sparkle-signature.txt release-manifest.txt; do
            gh release download "$EXPECTED_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$release_dir"
          done
          readonly verifier="$RUNNER_TEMP/verify-sparkle-signature"
          xcrun swiftc -parse-as-library Scripts/verify_sparkle_signature.swift -o "$verifier"
          SPARKLE_SIGNATURE_VERIFIER="$verifier" bash Scripts/validate_appcast_release.sh \
            "$release_dir" "$EXPECTED_RELEASE_TAG" "$release_root/release-body.txt"
          signature="$(<"$release_dir/sparkle-signature.txt")"
          readonly signature
          printf 'VERIFIED_RELEASE_TAG=%s\nVERIFIED_SPARKLE_SIGNATURE=%s\n' \
            "$EXPECTED_RELEASE_TAG" "$signature" >> "$GITHUB_ENV"

      - name: Setup Ruby
        uses: ruby/setup-ruby@7bae1d00b5db9166f4f0fc47985a3a5702cb58f0 # v1.197.0
        with:
          ruby-version: '3.3'

      - name: Install pinned Bundler
        run: gem install bundler --version "$BUNDLER_VERSION" --no-document

      - name: Install dependencies
        working-directory: AppCast
        run: bundle "_${BUNDLER_VERSION}_" install --jobs 4 --retry 3

      - name: Test appcast generation
        working-directory: AppCast
        run: bundle "_${BUNDLER_VERSION}_" exec ruby test_appcast.rb

      - name: Build appcasts
        working-directory: AppCast
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: bundle "_${BUNDLER_VERSION}_" exec jekyll build

      - name: Validate rendered appcasts
        run: |
          set -euo pipefail
          xmllint --noout AppCast/_site/appcast.xml AppCast/_site/appcast_pre.xml
          ruby Scripts/validate_rendered_appcast.rb \
            AppCast/_site/appcast.xml "$VERIFIED_RELEASE_TAG" "$RUNNER_TEMP/appcast-release/$VERIFIED_RELEASE_TAG/sparkle-signature.txt"

      - name: Upload verified appcasts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appcast-site
          path: AppCast/_site
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.repository == 'jacobcxdev/XcodesApp'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified appcasts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: appcast-site
          path: AppCast/_site

      - name: Publish GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: AppCast/_site
          clean: true
          single-commit: true
